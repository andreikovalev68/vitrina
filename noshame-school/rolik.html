<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ролик по сайту NO SHAME</title>
<style>
:root{--night:#0d0e1f;--plum:#181638;--line:#34306a;--ice:#f0eeff;--mist:#b4b0d6;--rasp:#e4285f;--rasp-hi:#ff6f93;--rasp-edge:#8c1038}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--night);color:var(--ice);font:400 1.05rem/1.55 "Golos Text",system-ui,sans-serif;display:grid;place-items:center;padding:20px;
  background-image:radial-gradient(800px 480px at 80% -10%,rgba(90,108,255,.28),transparent 60%),radial-gradient(600px 400px at -10% 30%,rgba(228,40,95,.18),transparent 60%)}
main{width:min(100%,420px);display:grid;gap:18px;text-align:center}
h1{font:800 1.3rem/1.2 "Unbounded","Arial Black",system-ui,sans-serif}
video{width:100%;aspect-ratio:9/16;border-radius:18px;border:1px solid var(--line);background:#000;display:block}
p{color:var(--mist);font-size:.95rem}
.btn{display:inline-block;text-decoration:none;color:#fff;font:800 1rem/1.2 "Unbounded","Arial Black",system-ui,sans-serif;padding:16px 26px;border-radius:14px;
  background:linear-gradient(180deg,var(--rasp-hi),var(--rasp) 58%);text-shadow:0 1px 0 #ffb3c6,0 2px 0 #b81c48,0 3px 0 #8c1038;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 2px 0 var(--rasp-edge),0 4px 0 var(--rasp-edge),0 6px 0 var(--rasp-edge),0 14px 22px -6px rgba(0,0,0,.6);transform:translateY(-4px)}
</style>
</head>
<body>
<main>
  <h1>Ролик по сайту NO SHAME</h1>
  <video controls playsinline preload="metadata" poster="rolik/poster.jpg" src="rolik/noshame-rolik.mp4"></video>
  <p>Школа голоса, речи и актёрского мастерства. 35 секунд.</p>
  <a class="btn" href="index.html">Открыть сайт</a>
</main>
</body>
</html>
